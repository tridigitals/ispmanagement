name: mobile_technician
description: ISP Management — Technician mobile app (Flutter, iOS + Android)
version: 0.1.0+12
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  result_dart: ^2.0.0

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  pull_to_refresh: ^2.0.0
  fl_chart: ^0.69.0
  data_table_2: ^2.5.12

  # Notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  sentry_flutter: ^8.5.0
  flutter_local_notifications: ^19.5.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  package_info_plus: ^8.1.3
  signature: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
