name: mobile_technician
description: ISP Management — Technician mobile app (Flutter, Android + iOS)
version: 0.2.0+10
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  result_dart: ^2.0.0

  # Navigation
  go_router: ^14.0.0

  # Networking + realtime
  api_client:
    path: ../../packages/api_client

  # Shared UI widgets + theme tokens
  ui_kit:
    path: ../../packages/ui_kit

  # Local storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # Auth + biometric
  local_auth: ^2.3.0
  crypto: ^3.0.5

  # Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^19.5.0

  # File handling
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Sprint 3: Signature pad for ticket resolve
  signature: ^5.5.0

  # Maps & location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Misc
  intl: ^0.19.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true