plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '0.1.0'

android {
    namespace "com.tridigitals.ispmgt.technician"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.tridigitals.ispmgt.technician"
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            // Try key.properties first (CI writes this), fallback to release-key.jks (local)
            def keystoreFile = file("release-key.jks")
            def keystorePassword = "ispcustomer123"
            def keystoreKeyAlias = "ispcustomer"
            def keystoreKeyPassword = "ispcustomer123"

            def keyPropertiesFile = file("key.properties")
            if (keyPropertiesFile.exists()) {
                def keyProps = new Properties()
                keyPropertiesFile.withReader('UTF-8') { reader -> keyProps.load(reader) }
                keystoreFile = file(keyProps.getProperty("storeFile", "release-key.jks"))
                keystorePassword = keyProps.getProperty("storePassword", keystorePassword)
                keystoreKeyAlias = keyProps.getProperty("keyAlias", keystoreKeyAlias)
                keystoreKeyPassword = keyProps.getProperty("keyPassword", keystoreKeyPassword)
            }
            storeFile keystoreFile
            storePassword keystorePassword
            keyAlias keystoreKeyAlias
            keyPassword keystoreKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}