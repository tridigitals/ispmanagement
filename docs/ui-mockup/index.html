<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISPMANAGEMENT — Full Mockup (28 Screens)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#060609; --bg2:#0D0D14; --surface:#111119; --surface2:#181824;
  --border:#1E1E2E; --border2:#282838;
  --accent:#7C4DFF; --accent2:#B388FF; --accent-glow:rgba(124,77,255,0.25);
  --green:#00E676; --green2:#69F0AE; --red:#FF5252; --red2:#FF8A80;
  --amber:#FFD740; --amber2:#FFE57F; --blue:#40C4FF; --blue2:#80D8FF;
  --text:#F5F5FA; --text2:#B0B0C0; --text3:#6B6B80;
  --rs:10px; --rm:16px; --rl:20px; --rxl:24px; --rp:999px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#010104;color:var(--text);padding:16px}
h1{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:var(--text3);text-align:center;margin:20px 0}
.tabs{display:flex;gap:4px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.tab{padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rp);font-size:12px;font-weight:700;cursor:pointer;color:var(--text3);transition:all .15s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.screens{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.phone{width:390px;height:844px;background:var(--bg);border-radius:48px;overflow:hidden;position:relative;box-shadow:0 0 0 3px #1a1a2e,0 0 0 6px #0d0d14,0 0 0 8px #1a1a2e,0 32px 80px rgba(0,0,0,.7)}
.phone::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#0a0a0f;border-radius:0 0 20px 20px;z-index:10}
.content{height:844px;overflow-y:auto;padding-top:12px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rp);font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%}
.dot.g{background:var(--green);box-shadow:0 0 8px rgba(0,230,118,.3)}
.dot.r{background:var(--red);box-shadow:0 0 8px rgba(255,82,82,.3)}
.dot.a{background:var(--amber)}
.nc{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rxl);padding:16px}
.nc-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rm);box-shadow:3px 3px 0 var(--border2);transition:all .15s}
.nc-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--border2)}
.btn{width:100%;padding:14px;border:none;border-radius:var(--rm);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-accent{background:var(--accent);color:white;box-shadow:0 8px 24px var(--accent-glow)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
.badge{padding:4px 10px;border-radius:var(--rp);font-size:10px;font-weight:700;white-space:nowrap}
.badge.g{background:rgba(0,230,118,.12);color:var(--green)}
.badge.r{background:rgba(255,82,82,.12);color:var(--red)}
.badge.a{background:rgba(255,215,64,.12);color:var(--amber)}
.badge.b{background:rgba(64,196,255,.12);color:var(--blue)}
.chip{padding:6px 14px;border-radius:var(--rp);font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text3)}
.chip.ac{background:var(--accent);color:white;border-color:var(--accent)}
.fnav{position:absolute;bottom:24px;left:12px;right:12px;display:flex;gap:4px;background:rgba(17,17,25,.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.07);border-radius:var(--rxl);padding:5px}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:var(--rm);cursor:pointer;position:relative}
.ni.ac{background:rgba(124,77,255,.12)}
.ni.l{font-size:10px;font-weight:600}
.money{font-weight:900;letter-spacing:-2px;line-height:.95}
.ico{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.ico-r{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.input-box{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rm);padding:14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;width:100%}
.label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:6px;display:block}
</style>
</head>
<body>

<!-- Navigation Tabs -->
<div class="tabs" id="navTabs"></div>
<div class="screens" id="screenContainer"></div>

  ]},
  { name: '🏠 Home Tabs (4)', screens: [
    { id: 'hometab', fn: homeTabScr, label: 'Beranda' },

];

const allScreens = groups.flatMap(g => g.screens);
let activeGroup = 0;

function renderTabs() {
  document.getElementById('navTabs').innerHTML = groups.map((g,i) =>
    `<div class="tab${i===activeGroup?' active':''}" onclick="showGroup(${i})">${g.name}</div>`
  ).join('');
}

function showGroup(idx) {
  activeGroup = idx;
  renderTabs();
  const group = groups[idx];
  const container = document.getElementById('screenContainer');
  container.innerHTML = group.screens.map(s =>
    `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;">${s.label}</div>
      <div class="phone" id="sc-${s.id}"></div>
    </div>`
  ).join('');
  group.screens.forEach(s => {
    document.getElementById('sc-' + s.id).innerHTML = s.fn();
  });
}

renderTabs();
showGroup(0);
</script>
