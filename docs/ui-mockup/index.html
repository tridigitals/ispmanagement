<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISPMANAGEMENT — Redesign V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060609;
    --bg2: #0D0D14;
    --surface: #111119;
    --surface2: #181824;
    --border: #1E1E2E;
    --border-light: #282838;
    --accent: #7C4DFF;
    --accent2: #B388FF;
    --accent-glow: rgba(124, 77, 255, 0.25);
    --green: #00E676;
    --green2: #69F0AE;
    --green-glow: rgba(0, 230, 118, 0.2);
    --red: #FF5252;
    --red2: #FF8A80;
    --amber: #FFD740;
    --amber2: #FFE57F;
    --blue: #40C4FF;
    --blue2: #80D8FF;
    --text: #F5F5FA;
    --text2: #B0B0C0;
    --text3: #6B6B80;
    --r-sm: 10px;
    --r-md: 16px;
    --r-lg: 20px;
    --r-xl: 24px;
    --r-2xl: 32px;
    --r-pill: 999px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #010104;
    color: var(--text);
    display: flex;
    gap: 40px;
    padding: 48px 40px;
    overflow-x: auto;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .screen-group { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .screen-group h2 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; color: var(--text3); }

  .phone {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 3px #1a1a2e,
      0 0 0 6px #0d0d14,
      0 0 0 8px #1a1a2e,
      0 32px 80px rgba(0,0,0,0.7),
      inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .phone::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 30px;
    background: #0a0a0f;
    border-radius: 0 0 20px 20px;
    z-index: 10;
  }

  .content {
    height: 844px;
    overflow-y: auto;
    padding-top: 12px;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  /* Floating elements */
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    font-size: 12px; font-weight: 600;
  }
  .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.green { background: var(--green); box-shadow: 0 0 8px var(--green-glow); }
  .dot.red { background: var(--red); box-shadow: 0 0 8px rgba(255,82,82,0.3); }

  .glass-card {
    background: rgba(17,17,25,0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--r-xl);
    overflow: hidden;
  }

  .neubrutal-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--r-xl);
    box-shadow: 4px 4px 0 var(--border-light);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .neubrutal-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--border-light); }

  /* Bento grid */
  .bento { display: grid; gap: 12px; }

  .floating-nav {
    position: absolute; bottom: 28px; left: 16px; right: 16px;
    display: flex; gap: 6px;
    background: rgba(17,17,25,0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--r-xl);
    padding: 6px;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 4px 8px;
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    position: relative;
  }
  .nav-item.active { background: rgba(124,77,255,0.15); }
  .nav-item:active { transform: scale(0.94); }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.2px; }

  /* Bold number */
  .money {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 0.95;
  }
</style>
</head>
<body>

<!-- ─── SCREEN 1: HOME (Bento + Floating Nav) ─── -->
<div class="screen-group">
  <h2>🏠 HOME — Bento Grid</h2>
  <div class="phone" id="home-v2"></div>
</div>

<!-- ─── SCREEN 2: LOGIN (Minimalist) ─── -->
<div class="screen-group">
  <h2>🔐 LOGIN</h2>
  <div class="phone" id="login-v2"></div>
</div>

<!-- ─── SCREEN 3: INVOICE (Receipt Style) ─── -->
<div class="screen-group">
  <h2>🧾 INVOICE</h2>
  <div class="phone" id="invoice-v2"></div>
</div>

<!-- ─── SCREEN 4: PROFILE (Apple Settings) ─── -->
<div class="screen-group">

</div>

<script>

  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',

// ═══════════════════════════════════════ SCREEN 1: HOME ═══════════════════════════════════════
function homeV2() {
